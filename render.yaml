# Render Blueprint — lets Render auto-configure this service from the repo.
# Deploy: push this repo to GitHub, then on Render click
# New -> Blueprint and point it at the repo. Render reads this file
# and sets everything up (build command, start command) for you.
#
# FREE PLAN NOTE: Render's free plan doesn't support persistent disks, so
# the auth_info_baileys/ session folder is wiped every time the service
# restarts. Free-tier services also spin down after ~15 min of no web
# traffic and restart on the next request — so expect to re-pair
# periodically rather than staying connected indefinitely. If you later
# want the session to persist, switch plan to `starter` and add a disk
# block (see render.yaml history / ask me and I'll add it back).

services:
  - type: web
    name: whatsapp-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PREFIX
        value: "!"
      - key: BOT_NAME
        value: "Wen_Xuan106’s Whatsapp bot"
